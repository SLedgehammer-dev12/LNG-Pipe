name: Build & Release Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest

      - name: Run test suite
        run: pytest tests/ -q

      - name: Build macOS arm64 .app and .dmg
        run: bash packaging/build_macos_dmg.sh

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: LNG-Simulator-macOS-arm64
          path: dist/LNG-Simulator-macOS-arm64.dmg
          if-no-files-found: error

  build-windows-x64:
    name: Windows x64 (.exe + Setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt pytest

      - name: Run test suite
        shell: pwsh
        run: pytest tests/ -q

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Windows portable ZIP and Setup.exe
        shell: pwsh
        run: pwsh -File packaging/build_windows.ps1 -RequireInstaller

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LNG-Simulator-Windows-x64
          path: |
            dist/LNG-Simulator-Windows-x64-portable.zip
            dist/LNG-Simulator-Setup-x64.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-macos-arm64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
